{% include "header.html" %}

<div class="bg-green-600 text-white text-center py-4 text-2xl font-bold">
    Even and Odd Differentiator
</div>

<!-- Alert Section -->
<div class="container mt-3">
    {% if error %}
    <div class="bg-red-500 text-white p-3 rounded-lg text-center">
        Please Enter the Value
    </div>
    {% endif %}
</div>

<!-- Form Container -->
<div class="flex justify-center items-center min-h-screen bg-gray-100">
    <div class="bg-white p-6 rounded-lg shadow-lg w-96">
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label for="num1" class="block text-lg font-semibold">Enter the Number</label>
                <input type="number" class="w-full p-3 border border-gray-300 rounded-lg mt-2" name="num1" id="num1">
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white p-3 rounded-lg font-bold hover:bg-blue-600 transition">
                Submit
            </button>
            <div class="mt-4">
                <label for="result" class="block text-lg font-semibold">This Number is</label>
                <input type="text" class="w-full p-3 border border-gray-300 rounded-lg mt-2 bg-gray-100 text-center font-semibold" id="result" value="{{answer}}" readonly>
            </div>
        </form>
    </div>
</div>
