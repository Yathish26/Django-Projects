{% include "header.html" %}
<title>{{ blogdata.Title }}</title>

{% load static %}
<link rel='stylesheet' href="{% static 'css/blogdetail.css' %}">

<div class="bg-green-600 text-white text-center py-4 text-2xl font-bold">
    {{ title }}
</div>

<div class="container mx-auto mt-6 p-6">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-4xl font-bold text-gray-800 text-center">{{ blogdata.Title }}</h1>
        <p class="text-gray-500 text-center mt-2">Category: <span class="font-semibold">{{ blogdata.Category }}</span></p>

        {% if blogdata.Photos %}
        <div class="flex justify-center mt-6">
            <img src="/media/{{ blogdata.Photos }}" alt="{{ blogdata.Title }}" class="shadow-lg rounded-lg max-w-[40%] h-auto">
        </div>
        {% endif %}

        <p class="text-lg text-gray-800 text-justify bg-gray-100 p-8 rounded-xl mt-6">
            {{ blogdata.Description | safe }}
        </p>
    </div>
</div>
