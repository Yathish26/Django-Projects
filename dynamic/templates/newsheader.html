{% include "header.html" %}
{% load static %}

<link rel="stylesheet" href="{% static 'css/newsheader.css' %}">

<div class="bg-red-700 text-white text-center py-4 relative">
    {% if "/news/create" not in request.path %}
    <a href="/news/create" class="absolute top-3 left-4">
        <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-md hover:scale-110 transition-transform">
            <div class="text-red-700 text-3xl font-bold">+</div>
        </div>
    </a>
    {% endif %}

    <!-- Navbar -->
    <nav class="container mx-auto flex flex-wrap justify-center md:justify-start">
        <button class="md:hidden text-white focus:outline-none" onclick="toggleNav()">
            ☰
        </button>
        <ul id="nav-menu" class="hidden md:flex flex-wrap gap-4 mt-4 md:mt-0">
            <li><a href="/news/topnews" class="hover:text-gray-300">Top News</a></li>
            <li><a href="/news/business" class="hover:text-gray-300">Business</a></li>
            <li><a href="/news/technology" class="hover:text-gray-300">Technology</a></li>
            <li><a href="/news/sports" class="hover:text-gray-300">Sports</a></li>
            <li><a href="/news/entertainment" class="hover:text-gray-300">Entertainment</a></li>
            <li><a href="/news/health" class="hover:text-gray-300">Health</a></li>
            <li><a href="/news/science" class="hover:text-gray-300">Science</a></li>
            <li><a href="/news/politics" class="hover:text-gray-300">Politics</a></li>
            <li><a href="/news/education" class="hover:text-gray-300">Education</a></li>
            <li><a href="/news/automobiles" class="hover:text-gray-300">Automobiles</a></li>
            <li><a href="/news/lifestyle" class="hover:text-gray-300">Lifestyle</a></li>
            <li><a href="/news/crime" class="hover:text-gray-300">Crime</a></li>
            <li><a href="/news/agriculture" class="hover:text-gray-300">Agriculture</a></li>
        </ul>
    </nav>

    <!-- Search Bar -->
    <div class="mt-4">
        <form class="flex items-center justify-center space-x-2">
            <input class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" name="searchkey" type="text" placeholder="Search">
            <button class="px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition">Search</button>
        </form>
    </div>
</div>

<script>
    function toggleNav() {
        const navMenu = document.getElementById("nav-menu");
        navMenu.classList.toggle("hidden");
    }
</script>
