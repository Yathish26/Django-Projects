{% include "header.html" %}

<div class="bg-yellow-400 text-black font-bold text-center py-6 text-2xl">
    {{ title }}
</div>

<form method="post" id="blog" action="{% url 'blogged' %}" enctype="multipart/form-data" class="max-w-lg mx-auto mt-8 p-6 bg-white shadow-lg rounded-lg">
    {% csrf_token %}
    
    <div class="mb-4">
        <input type="text" name="Title" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Title">
    </div>
    
    <div class="mb-4">
        <input type="text" name="Category" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Category">
    </div>
    
    <div class="mb-4">
        <textarea name="Description" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Description"></textarea>
    </div>
    
    <div class="mb-4">
        <input type="file" name="Photo" class="w-full file:bg-blue-500 file:text-white file:px-4 file:py-2 file:rounded-lg file:cursor-pointer">
    </div>
    
    <button type="submit" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 transition">
        Submit
    </button>
</form>

{% if inputerror %}
    <div class="max-w-lg mx-auto mt-4 bg-red-500 text-white text-center p-3 rounded-lg">
        Please Input Values
    </div>
{% endif %}

{% if categoryerror %}
    <div class="max-w-lg mx-auto mt-4 bg-red-500 text-white text-center p-3 rounded-lg">
        Please Enter the Category
    </div>
{% endif %}

{% if descriptionerror %}
    <div class="max-w-lg mx-auto mt-4 bg-red-500 text-white text-center p-3 rounded-lg">
        Please Input Description
    </div>
{% endif %}

{% if titleerror %}
    <div class="max-w-lg mx-auto mt-4 bg-red-500 text-white text-center p-3 rounded-lg">
        Please Enter the Title
    </div>
{% endif %}
