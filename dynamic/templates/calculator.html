{% include "header.html" %}
{% load static %}

<link rel="stylesheet" href="{% static 'css/calc.css' %}">

<div class="bg-green-600 text-white text-center py-4 text-2xl font-bold">
    Calculator from JavaScript
</div>

<div class="flex justify-center items-center min-h-screen bg-gray-100">
    <div class="bg-white p-6 rounded-lg shadow-lg w-80">
        <div id="display" class="text-right bg-gray-200 text-3xl p-4 rounded-lg mb-4">0</div>
        <div class="grid grid-cols-4 gap-2">
            <button class="button bg-red-500 text-white" onclick="clearDisplay()">C</button>
            <button class="button bg-gray-300" onclick="appendToDisplay('(')">(</button>
            <button class="button bg-gray-300" onclick="appendToDisplay(')')">)</button>
            <button class="button bg-yellow-500" onclick="appendToDisplay('/')">/</button>
            
            <button class="button bg-gray-200" onclick="appendToDisplay('7')">7</button>
            <button class="button bg-gray-200" onclick="appendToDisplay('8')">8</button>
            <button class="button bg-gray-200" onclick="appendToDisplay('9')">9</button>
            <button class="button bg-yellow-500" onclick="appendToDisplay('*')">*</button>

            <button class="button bg-gray-200" onclick="appendToDisplay('4')">4</button>
            <button class="button bg-gray-200" onclick="appendToDisplay('5')">5</button>
            <button class="button bg-gray-200" onclick="appendToDisplay('6')">6</button>
            <button class="button bg-yellow-500" onclick="appendToDisplay('-')">-</button>

            <button class="button bg-gray-200" onclick="appendToDisplay('1')">1</button>
            <button class="button bg-gray-200" onclick="appendToDisplay('2')">2</button>
            <button class="button bg-gray-200" onclick="appendToDisplay('3')">3</button>
            <button class="button bg-yellow-500" onclick="appendToDisplay('+')">+</button>

            <button class="button col-span-2 bg-gray-200" onclick="appendToDisplay('0')">0</button>
            <button class="button bg-gray-300" onclick="appendToDisplay('.')">.</button>
            <button class="button bg-green-500 text-white" onclick="calculate()">=</button>
        </div>
    </div>
</div>

{% block Javascipt %}
<script src="{% static 'javascript/calc.js' %}"></script>
{% endblock %}
